[project]
name = "risk-prediction"
version = "0.1.0"
description = "IT Infrastructure Risk Prediction System using R-GCN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.3.0",
    "dgl>=2.2.0",
    "torchdata>=0.7.0,<0.8.0",
    "polars>=0.20.0",
    "networkx>=3.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
