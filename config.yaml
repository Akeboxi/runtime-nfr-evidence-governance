model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  node_types:
    - Vphy
    - Vvm
    - Vbiz

training:
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.00001
  batch_size: 1
  focal_loss:
    alpha: 0.5
    gamma: 1.0
  optimizer: adam
  early_stopping:
    patience: 10
    min_delta: 0.001

risk_threshold:
  high: 0.7
  medium: 0.3

detection:
  loess:
    span: 0.3
    degree: 1
  ewma:
    alpha: 0.1
  anomaly_threshold: 2.0

data:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  sequence_length: 60
  change_window_minutes: 30

paths:
  data_dir: ./data
  model_dir: ./models
  log_dir: ./logs
